map $request_method $chamado_publico_ip {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $chamado_publico_ip zone=chamado_publico:10m rate=30r/m;

server {
    listen 80;
    root /usr/share/nginx/html;

    location = /api/publico/chamado {
        client_max_body_size 21m;
        limit_req zone=chamado_publico burst=60 nodelay;
        limit_req_status 429;
        error_page 429 = @chamado_publico_limitado;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location @chamado_publico_limitado {
        default_type application/json;
        return 429 '{"status":429,"message":"Muitos envios em pouco tempo. Tente novamente em alguns minutos."}';
    }

    location /api/ {
        # Evidências da tarefa: até 5 MB por imagem.
        client_max_body_size 6m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
