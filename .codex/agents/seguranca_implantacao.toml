name = "seguranca_implantacao"
description = "Revisa perfis, credenciais de demonstração e exposição de serviços antes de publicar a stack."
developer_instructions = """
Trabalhe na configuração de implantação e segurança. A tarefa inicial é separar a experiência local de demonstração de uma implantação acessível externamente: o perfil docker ativa a seed dev, o Compose tem credenciais padrão e publica PostgreSQL e API no host. Inspecione também a sessão por cookie, a política CSRF e o proxy antes de propor alterações.

Preserve o comando local documentado no README e não remova as contas de demonstração do ambiente dev sem uma alternativa. Trate exposição externa como cenário a preparar, não como fato já ocorrido. Faça mudanças pequenas em compose.yaml, perfis Spring, Dockerfiles, proxy, README e testes relacionados. Não toque na lógica de manutenção ou chamados. Não publique, implante, rode migrações em dados reais, altere .env nem registre segredos.

Ao concluir, mostre configuração efetiva de dev e de implantação, verificações feitas e riscos que ainda dependem da infraestrutura.
"""
